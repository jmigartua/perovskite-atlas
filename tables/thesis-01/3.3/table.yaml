caption_plain: 'Detalles de las estructuras de las fases tetragonales y temperaturas de las transiciones de fase de los compuestos Sr₂ MWO₆(M=Ni, Zn, Co, Mg, Cu). Los datos presentados son los siguientes: referencia en la literatura (Ref.); parámetros de red (a, c); Distancias M-O1 y M-O2 en los octaedros MO₆ (d₁, d₂); ángulo de rotación de los octaedros WO₆ alrededor del eje c(φ); Temperatura de la transición de fase de la fase tetragonal a la fase cúbica (T_c); Parámetro de pseudosimetría para el grupo espacial F m 3̄ m(Δ). PT significa presente trabajo.'
