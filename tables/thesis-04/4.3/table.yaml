caption: Summary of the symmetry mode decomposition, with respect to the ideal cubic perovskite F m 3̄ m, of the room temperature monoclinic phase ( P 2₁ / n), as given by AMPLIMODES. The primary mode, if existing, is written in bold letters. For each irrep the number of basis modes associated to the indicated atoms is shown in parenthesis. Atom labels refer to the F m 3̄ m structure. The column headed Dimension refers to number of basis modes necessary in general to describe the corresponding irrep distortion; whereas the one headed as Direction indicates, in the convention of ISOTROPY [ISOTROPY], the direction in the irrep space corresponding to the irrep distortion. Mode amplitudes are given in the last column and their standard deviations in parenthesis.
