caption: 'Input information for AMPLIMODES for FullProf: high-symmetry phase information (prototype structure), low-symmetry structure information and transformation matrix for $\mathrm{Sr}_{2} \mathrm{Co}_{1-x} \mathrm{Mg}_{x} \mathrm{TeO}_{6}. P 2_{1} / n$ (ITA No.14, non-standard setting), I2/m (ITA No.12, non-standard setting), I4/m (ITA No.87, standard setting) and $F m \overline{3} m$ (ITA No.225, standard setting). The second part shows a list of the irreps taking part in the symmetry breaking from the cubic space group ( $F m \overline{3} m$) to the monoclinic $P 2_{1} / n$ and $I 2 / m$ space groups observed experimentally at RT, and to the tetragonal space group $I 4 / m$, observed as intermediate high-temperature space group. The list is part of the output of AMPLIMODES for FullProf. The number in parenthesis indicate the number of modes transforming according to the irrep. The irreps in bold are the ones representing the order parameters: 2 in the $P 2_{1} / n$ and one in the
  $I 2 / m$ space groups, respectively (see text)'
