caption_plain: 'Input information for AMPLIMODES for FullProf: high-symmetry phase information (prototype structure), low-symmetry structure information and transformation matrix for Sr₂ Co₁₋ₓ Mgₓ TeO₆. P 2₁ / n (ITA No.14, non-standard setting), I2/m (ITA No.12, non-standard setting), I4/m (ITA No.87, standard setting) and F m 3̄ m (ITA No.225, standard setting). The second part shows a list of the irreps taking part in the symmetry breaking from the cubic space group ( F m 3̄ m) to the monoclinic P 2₁ / n and I 2 / m space groups observed experimentally at RT, and to the tetragonal space group I 4 / m, observed as intermediate high-temperature space group. The list is part of the output of AMPLIMODES for FullProf. The number in parenthesis indicate the number of modes transforming according to the irrep. The irreps in bold are the ones representing the order parameters: 2 in the P 2₁ / n and one in the I 2 / m space groups, respectively (see text)'
