$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "structure.schema.yaml"
allOf: [{$ref: "_defs.schema.yaml#/$defs/envelope"}]
required: [material, conditions, space_group, cell, atoms]
properties:
  material: {$ref: "_defs.schema.yaml#/$defs/id"}
  phase_label: {type: string}
  conditions:
    type: object
    required: [temperature_k]
    properties:
      temperature_k: {type: number}
      pressure_gpa: {type: number}
      x: {type: number}
  space_group:
    type: object
    required: [hm, number]
    properties:
      hm: {type: string}
      number: {type: integer, minimum: 1, maximum: 230}
      setting: {type: string}
      crystal_system: {type: string}
  cell:
    type: object
    required: [a, b, c, alpha, beta, gamma]
    properties:
      a: {$ref: "_defs.schema.yaml#/$defs/measured"}
      b: {$ref: "_defs.schema.yaml#/$defs/measured"}
      c: {$ref: "_defs.schema.yaml#/$defs/measured"}
      alpha: {$ref: "_defs.schema.yaml#/$defs/measured"}
      beta: {$ref: "_defs.schema.yaml#/$defs/measured"}
      gamma: {$ref: "_defs.schema.yaml#/$defs/measured"}
      volume: {$ref: "_defs.schema.yaml#/$defs/measured"}
  atoms:
    type: array
    minItems: 1
    items:
      type: object
      required: [label, element, wyckoff, x, y, z]
      properties:
        label: {type: string}
        element: {type: string}
        wyckoff: {type: string}
        x: {$ref: "_defs.schema.yaml#/$defs/measured"}
        y: {$ref: "_defs.schema.yaml#/$defs/measured"}
        z: {$ref: "_defs.schema.yaml#/$defs/measured"}
        occupancy: {type: string}
        b_iso: {$ref: "_defs.schema.yaml#/$defs/measured"}
        fixed: {type: array, items: {type: string}}
  cif: {type: string, description: "file in this directory; original or rebuilt"}
  cif_origin: {enum: [original, rebuilt, absent]}
  is_aristotype: {type: boolean}
  parent: {$ref: "_defs.schema.yaml#/$defs/id"}
  refinement: {type: string, description: "refinement.yaml in this directory"}
  modes: {type: string, description: "modes.yaml in this directory"}
  geometry: {type: string, description: "geometry.yaml in this directory"}
