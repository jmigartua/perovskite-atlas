<!-- Perovskite Atlas: in-site digitiser for plates. Calibrate two ticks per axis, click points per series, zoom,
     get curve.csv + curve.yaml for a `curves/<slug>/` record (point_status: digitised). No server.
     Two hosts: the Digitise tab of a plate page ([data-digitise] with data-* metadata) and the dedicated page
     /digitise/?plate=plt:… ([data-digitise-page], metadata fetched from _data/computed/plates/<slug>.json). -->
<script>
(function () {
  var ROOT = (function () { var a = document.querySelector("a.wordmark"); if (!a) return "/"; var p = new URL(a.getAttribute("href"), location.href).pathname; return p.replace(/index\.html$/, ""); })();
  function abs(p) { return p.charAt(0) === "/" ? ROOT + p.slice(1) : p; }
  function el(tag, attrs, html) { var e = document.createElement(tag); for (var k in attrs || {}) { if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html !== undefined) e.innerHTML = html; return e; }
  function lin(p, c) { return c.v1 + (p - c.p1) * (c.v2 - c.v1) / (c.p2 - c.p1); }
  function loglin(p, c) { var l1 = Math.log10(c.v1), l2 = Math.log10(c.v2); return Math.pow(10, l1 + (p - c.p1) * (l2 - l1) / (c.p2 - c.p1)); }
  function fmt(v, d) { return Number(v).toFixed(d); }
  function slugify(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 24); }
  var COLORS = ["#2f6b5e", "#a8842f", "#2e526e", "#b03a2e", "#6b4f8a", "#4d8a7c"];

  function tool(host, meta) {
    var KEY = "atlas-dig:" + meta.plate;
    var st = { cal: { x: null, y: null }, step: "x1", tmp: {}, series: [], cur: null, xlog: false, ylog: false, zoom: 1 };
    var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    if (saved) { st.cal = saved.cal; st.step = saved.step; st.tmp = saved.tmp; st.series = saved.series; st.cur = st.series.length ? st.series[st.series.length - 1] : null; st.xlog = !!saved.xlog; st.ylog = !!saved.ylog; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify({ cal: st.cal, step: st.step, tmp: st.tmp, series: st.series, xlog: st.xlog, ylog: st.ylog, when: new Date().toISOString() })); } catch (e) {} markDraft(meta.plate, true); }
    var wrap = el("div", { class: "dig" });
    var bar = el("div", { class: "dig-bar" });
    var status = el("span", { class: "dig-status" });
    var zoomlab = el("label", { class: "dig-zoom" }, "zoom <input type='range' min='100' max='400' step='10' value='100'> <span>100%</span>");
    bar.appendChild(status); bar.appendChild(zoomlab);
    var scroller = el("div", { class: "dig-scroll" });
    var stage = el("div", { class: "dig-stage" });
    var im = el("img", { src: meta.image, alt: "" }); var cv = el("canvas", { class: "dig-cv" });
    stage.appendChild(im); stage.appendChild(cv); scroller.appendChild(stage);
    var side = el("div", { class: "dig-side" });
    var form = el("div", { class: "dig-form" });
    var isAmp = meta.kind === "amplitude-vs-t";
    form.innerHTML =
      "<div class='dig-row'><b>x</b> <input data-xq value='Temperature' size='11' title='quantity'> <input data-xu value='K' size='3' title='unit'> col <input data-xc value='T' size='3'> <label class='inl'><input type='checkbox' data-xlog> log</label></div>" +
      "<div class='dig-row'><b>y</b> unit <input data-yu value='Å' size='3'> group <input data-yg value='" + (isAmp ? "amplitude" : "cell") + "' size='9'> <label class='inl'><input type='checkbox' data-ylog> log</label></div>" +
      "<div class='dig-row'><b>series</b> <input data-sname placeholder='a, b, c, GM4+' size='9'> ± <input data-su placeholder='u' size='4'> <button type='button' data-newseries class='btn'>Start series</button></div>" +
      "<div class='dig-row'><b>record</b> material <input data-mat value='" + (meta.material || "") + "' size='16'> source <input data-src value='digitised' size='8'></div>" +
      "<div class='dig-actions'><button type='button' data-undo class='btn'>Undo point</button><button type='button' data-recal class='btn'>Recalibrate</button><button type='button' data-discard class='btn'>Discard draft</button><button type='button' data-csv class='btn'>Download curve.csv</button><button type='button' data-yaml class='btn'>Download curve.yaml</button><button type='button' data-copy class='btn'>Copy both</button></div>";
    var table = el("div", { class: "dig-table" });
    side.appendChild(form); side.appendChild(table);
    if (meta.app) {
      wrap.classList.add("app");
      var appbar = document.querySelector("[data-appbar]");
      if (appbar) { appbar.querySelector("[data-status]").appendChild(status); appbar.querySelector("[data-zoom]").appendChild(zoomlab); bar.remove(); }
      else wrap.appendChild(bar);
      wrap.appendChild(side); wrap.appendChild(scroller); host.appendChild(wrap);
    } else { wrap.appendChild(bar); wrap.appendChild(scroller); wrap.appendChild(side); host.appendChild(wrap); }
    var ctx = cv.getContext("2d");
    function nat(ev) { var r = im.getBoundingClientRect(); return { x: (ev.clientX - r.left) * im.naturalWidth / r.width, y: (ev.clientY - r.top) * im.naturalHeight / r.height }; }
    function toData(p) { return { x: (st.xlog ? loglin : lin)(p.x, st.cal.x), y: (st.ylog ? loglin : lin)(p.y, st.cal.y) }; }
    function say(t) { status.innerHTML = t; }
    function prompts() {
      var m = { x1: "Click the <b>first x tick</b>, then type its value", x2: "Click the <b>second x tick</b>", y1: "Click the <b>first y tick</b>", y2: "Click the <b>second y tick</b>", pts: st.cur ? "Click the points of series <b>" + st.cur.name + "</b>" : "Calibrated. Name a series, press <b>Start series</b>, then click its points." };
      say(m[st.step]);
    }
    function draw() {
      cv.width = im.naturalWidth; cv.height = im.naturalHeight; ctx.clearRect(0, 0, cv.width, cv.height);
      var s = Math.max(1, im.naturalWidth / 700) / Math.sqrt(st.zoom);
      ["x1", "x2", "y1", "y2"].forEach(function (k) { var p = st.tmp[k]; if (!p) return; ctx.strokeStyle = "#a8842f"; ctx.lineWidth = 1.5 * s; ctx.setLineDash([6 * s, 4 * s]); ctx.beginPath(); if (k[0] === "x") { ctx.moveTo(p.x, 0); ctx.lineTo(p.x, cv.height); } else { ctx.moveTo(0, p.y); ctx.lineTo(cv.width, p.y); } ctx.stroke(); ctx.setLineDash([]); });
      st.series.forEach(function (se, i) {
        ctx.fillStyle = COLORS[i % COLORS.length];
        se.px.forEach(function (p) { ctx.beginPath(); ctx.arc(p.x, p.y, 4 * s, 0, 6.283); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = s; ctx.stroke(); });
      });
    }
    function rowsByX() {
      var rows = {}; st.series.forEach(function (s) { s.px.forEach(function (p) { var d = toData(p); var key = fmt(d.x, 1); rows[key] = rows[key] || {}; rows[key][s.name] = d.y; }); });
      return rows;
    }
    function render() {
      if (!st.series.length) { table.innerHTML = ""; return; }
      var rows = rowsByX(); var keys = Object.keys(rows).map(Number).sort(function (a, b) { return a - b; });
      var h = "<table><thead><tr><th>" + form.querySelector("[data-xc]").value + "</th>" + st.series.map(function (s, i) { return "<th><span class='sw' style='background:" + COLORS[i % COLORS.length] + "'></span>" + s.name + "</th>"; }).join("") + "</tr></thead><tbody>";
      keys.forEach(function (k) { h += "<tr><td>" + fmt(k, 1) + "</td>" + st.series.map(function (s) { var v = rows[fmt(k, 1)][s.name]; return "<td>" + (v === undefined ? "" : fmt(v, 4)) + "</td>"; }).join("") + "</tr>"; });
      table.innerHTML = h + "</tbody></table><p class='meta'>" + st.series.reduce(function (n, s) { return n + s.px.length; }, 0) + " points · x to 0.1, y to 4 decimals</p>";
    }
    function csv() {
      var xc = form.querySelector("[data-xc]").value || "x"; var head = [xc]; st.series.forEach(function (s) { head.push(s.name, s.name + "_u"); });
      var rows = rowsByX(); var lines = [head.join(",")];
      Object.keys(rows).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) { var r = rows[fmt(k, 1)]; var line = [fmt(k, 1)]; st.series.forEach(function (s) { line.push(r[s.name] === undefined ? "" : fmt(r[s.name], 4), r[s.name] === undefined ? "" : (s.u || "")); }); lines.push(line.join(",")); });
      return lines.join("\n") + "\n";
    }
    function yaml() {
      var mat = form.querySelector("[data-mat]").value || "mat:UNKNOWN", src = form.querySelector("[data-src]").value || "digitised";
      var xq = form.querySelector("[data-xq]").value, xu = form.querySelector("[data-xu]").value, xc = form.querySelector("[data-xc]").value, yu = form.querySelector("[data-yu]").value, yg = form.querySelector("[data-yg]").value;
      var kind = meta.kind || "";
      var slug = mat.replace(/^mat:/, "") + "." + (kind || "digitised") + "." + slugify(src);
      var y = st.series.map(function (s) { return "  - {quantity: \"" + s.name + "\", symbol: \"$" + s.name + "$\", unit: \"" + yu + "\", column: \"" + s.name + "\", group: " + yg + "}"; }).join("\n");
      return "id: crv:" + slug + "\nschema_version: \"0.1\"\nstatus: thesis-only\nvisibility: review\nmaterial: " + mat + "\ntitle: \"" + mat.replace(/^mat:/, "") + " · " + (kind || "digitised curve") + " (digitised from " + meta.plate + ")\"\n" +
        (kind ? "kind: " + kind + "\n" : "") + "x: {quantity: \"" + xq + "\", symbol: \"$T$\", unit: \"" + xu + "\", column: \"" + xc + "\"}\ny:\n" + y + "\ncsv: curve.csv\npoint_status: digitised\nreproduces: [" + meta.plate + "]\n" +
        "notes: \"Digitised in the atlas from the plate; uncertainties, when given, are the symbol size on the figure.\"\nevidence:\n  - {doc: " + meta.doc + ", md_line: " + meta.mdline + ", figure: \"" + meta.fig + "\", status: thesis-only, note: \"digitised\"}\n";
    }
    function download(name, text) { var b = new Blob([text], { type: "text/plain" }); var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; a.click(); }
    stage.addEventListener("click", function (ev) {
      var p = nat(ev);
      if (st.step !== "pts") {
        var v = prompt("Value at this " + st.step[0] + " tick:"); if (v === null || v === "") return;
        st.tmp[st.step] = p; st.tmp[st.step + "v"] = parseFloat(v.replace(",", "."));
        st.step = { x1: "x2", x2: "y1", y1: "y2", y2: "pts" }[st.step];
        if (st.step === "pts") { st.cal.x = { p1: st.tmp.x1.x, v1: st.tmp.x1v, p2: st.tmp.x2.x, v2: st.tmp.x2v }; st.cal.y = { p1: st.tmp.y1.y, v1: st.tmp.y1v, p2: st.tmp.y2.y, v2: st.tmp.y2v }; }
        draw(); prompts(); save(); return;
      }
      if (!st.cur) { prompts(); return; }
      st.cur.px.push(p); draw(); render(); save();
    });
    function setZoom(pct) { var inp = zoomlab.querySelector("input"); inp.value = pct; inp.dispatchEvent(new Event("input")); }
    scroller.addEventListener("wheel", function (e) { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); var inp = zoomlab.querySelector("input"); setZoom(Math.max(100, Math.min(400, parseInt(inp.value, 10) + (e.deltaY < 0 ? 10 : -10)))); }, { passive: false });
    zoomlab.querySelector("input").addEventListener("input", function (e) {
      var z = parseInt(e.target.value, 10) / 100; var prev = st.zoom; st.zoom = z;
      stage.style.width = (z * 100) + "%"; zoomlab.querySelector("span").textContent = e.target.value + "%";
      // keep the centre of the view in place
      scroller.scrollLeft = (scroller.scrollLeft + scroller.clientWidth / 2) * z / prev - scroller.clientWidth / 2;
      scroller.scrollTop = (scroller.scrollTop + scroller.clientHeight / 2) * z / prev - scroller.clientHeight / 2;
      draw();
    });
    form.querySelector("[data-newseries]").addEventListener("click", function () {
      var n = form.querySelector("[data-sname]").value.trim(); if (!n) { say("Give the series a name first."); return; }
      st.cur = { name: n, px: [], u: form.querySelector("[data-su]").value.trim() }; st.series.push(st.cur); form.querySelector("[data-sname]").value = ""; prompts(); render(); save();
    });
    form.querySelector("[data-undo]").addEventListener("click", function () { if (st.cur && st.cur.px.length) st.cur.px.pop(); draw(); render(); save(); });
    form.querySelector("[data-recal]").addEventListener("click", function () { st.step = "x1"; st.tmp = {}; draw(); prompts(); save(); });
    form.querySelector("[data-discard]").addEventListener("click", function () { if (!confirm("Discard the draft for this figure?")) return; try { localStorage.removeItem(KEY); } catch (e) {} markDraft(meta.plate, false); st.cal = { x: null, y: null }; st.step = "x1"; st.tmp = {}; st.series = []; st.cur = null; draw(); render(); prompts(); });
    form.querySelector("[data-xlog]").addEventListener("change", function (e) { st.xlog = e.target.checked; render(); });
    form.querySelector("[data-ylog]").addEventListener("change", function (e) { st.ylog = e.target.checked; render(); });
    form.querySelector("[data-csv]").addEventListener("click", function () { download("curve.csv", csv()); });
    form.querySelector("[data-yaml]").addEventListener("click", function () { download("curve.yaml", yaml()); });
    form.querySelector("[data-copy]").addEventListener("click", function () { var t = "# curve.yaml\n" + yaml() + "\n# curve.csv\n" + csv(); navigator.clipboard && navigator.clipboard.writeText(t); say("Copied curve.yaml and curve.csv to the clipboard."); });
    im.addEventListener("load", draw); if (im.complete) draw();
    prompts(); render();
    if (saved) say((saved.series.length ? "Draft restored (" + saved.series.length + " series, saved " + (saved.when || "").slice(0, 16).replace("T", " ") + "). " : "Calibration restored. ") + status.innerHTML);
    return wrap;
  }

  function hasDraft(id) { try { var d = JSON.parse(localStorage.getItem("atlas-dig:" + id) || "null"); return !!(d && (d.series.length || d.step !== "x1")); } catch (e) { return false; } }
  function markDraft(id, on) {
    document.querySelectorAll(".tab[data-tab='digitise']").forEach(function (t) { t.textContent = on ? "Digitise · draft" : "Digitise"; });
    document.querySelectorAll(".tile[data-plate='" + id + "'] .tile-n").forEach(function (n) { var old = n.querySelector(".tag.draft"); if (old) old.remove(); if (on) n.insertAdjacentHTML("beforeend", "<span class='tag draft'>draft</span>"); });
  }
  function metaFrom(box) {
    return { plate: box.getAttribute("data-plate"), image: box.getAttribute("data-image"), material: box.getAttribute("data-material") || "", kind: box.getAttribute("data-kind") || "", doc: box.getAttribute("data-doc"), mdline: box.getAttribute("data-mdline"), fig: box.getAttribute("data-fig") };
  }
  document.addEventListener("DOMContentLoaded", function () {
    // marks for drafts kept in this browser: gallery tiles and the plate page tab
    document.querySelectorAll(".tile[data-plate]").forEach(function (t) { if (hasDraft(t.getAttribute("data-plate"))) markDraft(t.getAttribute("data-plate"), true); });
    document.querySelectorAll("[data-digitise]").forEach(function (box) { if (hasDraft(box.getAttribute("data-plate"))) markDraft(box.getAttribute("data-plate"), true); });
    // plate page: Figure / Digitise tabs; the tool is built lazily when the tab is first opened
    document.querySelectorAll("[data-digitise]").forEach(function (box) {
      var built = false;
      var tab = document.querySelector(".tab[data-tab='digitise']");
      if (tab) tab.addEventListener("click", function () { if (!built) { built = true; tool(box, metaFrom(box)); } });
    });
    // dedicated page
    var page = document.querySelector("[data-digitise-page]");
    if (page) {
      var id = new URLSearchParams(location.search).get("plate");
      if (!id) { page.innerHTML = "<p class='meta'>Open this page from a plate (Figure › Digitise › Open in its own tab), or add <code>?plate=plt:…</code> to the address.</p>"; return; }
      fetch(ROOT + "_data/computed/plates/" + id.split(":")[1] + ".json").then(function (r) { return r.json(); }).then(function (m) {
        m.image = abs(m.image); m.app = true;
        var t = page.querySelector("[data-title]"); if (t) { t.innerHTML = "<a href='" + abs(m.url) + "' title='" + m.caption.replace(/'/g, "&#39;") + "'>" + m.title + "</a>"; }
        document.title = "Digitise · " + m.title;
        tool(page.querySelector("[data-host]"), m);
      }).catch(function () { page.innerHTML = "<p class='meta'>No plate with id <code>" + id + "</code> is available for digitising.</p>"; });
    }
  });
})();
</script>
