name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema pillow
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Validate records
        run: make validate
      - name: Generate pages
        run: make generate
      - name: Render
        run: quarto render
      - name: Audit
        run: make audit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # GitHub Pages is not available on a private repository with the current plan;
    # the build job still validates, renders and audits every push. Deploy runs once the repository is public.
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
