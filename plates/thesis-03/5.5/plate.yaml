caption: 'Variation of (a) $\mathrm{GM}_{4}^{+}$distortion irrep amplitude (Å); (b) $\mathrm{X}_{3}^{+}$distortion irrep amplitude (Å); (c) $\mathrm{X}_{5}^{+}$distortion irrep amplitude ( $\AA$), and (d) isotropic temperature factors ( $\AA^{2}$), as function of experimentally calculated tolerance factor for $\mathrm{SrNd} M \mathrm{RuO}_{6}(M=\mathrm{Zn}, \mathrm{Co}, \mathrm{Mg}, \mathrm{Ni})$ at room temperature. Label color and symbol indicate three different refinements: black full circle, isotropic temperature factors for O1, O 2 and O 3 independent; blue empty circle, isotropic temperature factors of O 1 and O 2 refined with the same code and O3 independent; and red star, all isotropic temperature factors refined with the same code. In (d) half-full black and blue symbols, and dotted lines indicate the average value of the isotropic temperature factors for each refinement.'
