caption: '(1)Observed (symbols), calculated (line) and difference (bottom line) XRPD ( \lambda=1.5406 \AA ) profile for SrPrMgRuO_6 at room temperature. The bars in the lower part of the graphic represent the Bragg-reflections'' positions for three different models: first row, P 2_1 / n; second row, I 2 / m and third row, P 4_2 / n. The rectangular section is enlarged in the inset, showing in detail the presence of supercell reflections. The arrows in panel b ) indicate the absence of those reflections in the I 2 / m space group model. (2) Observed (symbols), calculated (line) and difference (bottom line) SXRPD ( \lambda=0.8256 \AA ) profile for SrPrMgRuO_6 at room temperature using a structural model with the P 2_1 / n space group. The bars indicate the Bragg-reflections'' positions for P 2_1 / n and P 4_2 / n models. The inset shows the monoclinic splitting, the tetragonal symmetry does not take into account the observed splitting, ((a) and (c) panels). * indicates very small quantity
  of an unidentified impurity.'
