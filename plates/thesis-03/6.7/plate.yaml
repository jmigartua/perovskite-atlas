caption_plain: shows the temperature dependence of the laboratory X-ray diffraction profile projections around the ( 111;-111) monoclinic primitive reflections ( 2 θ=24^°-26^°) and (642) cubic reflection (2 θ=92^°-96^°). The reflections shift to lower 2 θ positions due to thermal expansion. At low temperatures the monoclinic primitive reflection is clearly seen and disappears at higher temperatures, indicating a phase transition to a non-primitive space group. All compounds undergo a temperature induced structural phase transition taking place at ≈ 1225,1050,950 and 1025 K, SrPrMRuO₆(M=Zn, Co, Mg, Ni) respectively. The XRPD experiment was not enough good to determine the new phases' symmetry.
