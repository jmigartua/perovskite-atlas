caption: Thermal evolution of the (111)(-111) primitive monoclinic and (642) cubic reflections, (top) and (bottom) respectively, of (left) SrPrZnRuO_6, (middle-left) SrPrCoRuO_6, (middle-right) SrPrNiRuO_6 and (right) SrPrMgRuO_6, obtained from XRPD ( Cu K_1,2 ) experiment. The scattered intensity is represented with yellow-red scale, light-yellow being high-intensity and dark-red lowest intensity. At the temperature indicated by a green line the primitive Bragg reflections disappear, and, at the same time, the monoclinic splitting transforms into a trigonal one.
