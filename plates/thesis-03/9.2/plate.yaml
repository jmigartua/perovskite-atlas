caption: Experimental (symbols) and calculated (line) neutron powder-diffraction profiles for the Rietveld refinement of $\mathrm{SrLnFeRuO}_{6}(\mathrm{Ln}=\mathrm{La}, \mathrm{Nd}, \mathrm{Pr})$ at room temperature, using a disordered orthorhombic (Pbnm) structural model. The upper (middle) markers indicate the position of the structural (magnetic) Bragg reflections and the lower markers the impurity ( $\mathrm{Nd}_{3} \mathrm{RuO}_{7}$ and $\mathrm{Pr}_{3} \mathrm{RuO}_{7}$) Bragg reflections. $\mathrm{La}_{3} \mathrm{RuO}_{7}$ impurity was excluded in order to guarantee the convergence of the refinement.
