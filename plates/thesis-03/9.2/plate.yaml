caption: Experimental (symbols) and calculated (line) neutron powder-diffraction profiles for the Rietveld refinement of SrLnFeRuO_6(Ln=La, Nd, Pr) at room temperature, using a disordered orthorhombic (Pbnm) structural model. The upper (middle) markers indicate the position of the structural (magnetic) Bragg reflections and the lower markers the impurity ( Nd_3 RuO_7 and Pr_3 RuO_7 ) Bragg reflections. La_3 RuO_7 impurity was excluded in order to guarantee the convergence of the refinement.
