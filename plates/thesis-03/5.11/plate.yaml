caption: Results of the XRPD data refinements at 880 K in $\mathrm{SrNdZnRuO}_{6}$, using five different models with $P 2_{1} / n, P 4_{2} / n, I 2 / m, I 4 / m$ and $R \overline{3}$ space groups. The failure of $I 2 / m, I 4 / m$ and $R \overline{3}$ symmetries is clear, since small peaks are observed in the pattern which are not indexed by the models. The tetragonal $P 4_{2} / n$ symmetry is suggested for the intermediate phase.
