caption: Tolerance factor and temperature dependence phase diagram of $\mathrm{SrLaMRuO}_{6} (\mathrm{M}=\mathrm{Zn}(\mathrm{PW}), \mathrm{Cu}[116], \mathrm{Mg}(\mathrm{PW}), \mathrm{Ni}[116]), \quad \mathrm{SrNdMRuO}_{6} \quad(\mathrm{M}=\mathrm{Zn}, \mathrm{Co}, \mathrm{Mg}, \mathrm{Ni}) \quad[120] \quad$ and $\quad \mathrm{SrPrMRuO}_{6} (\mathrm{M}=\mathrm{Co}, \mathrm{Mg}, \mathrm{Ni})$ [125]. PW stands for present work. Two green tonality are used in $P 2_{1} / n$ phase to distinguish the different transition sequences. Two-phase region separating $P 2_{1} / n$ from $R \overline{3}$ is shown in striped-yellow area. Grilled area highlights two phase transition overlapped area. Vertical dotted line is indicative of the same theoretical tolerance factor for $\mathrm{SrLaZnRuO}_{6}$ and $\mathrm{SrLaCoIrO}_{6}$ [127].
