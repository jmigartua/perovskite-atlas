caption: 'Experimental (symbols) and calculated (line) X-ray powder-diffraction profile for the Rietveld refinement of SrNdCoRuO_6 at room temperature, using a structural model with the space group P 2_1 / n. The bars in the lower part of the graphics represent the Bragg peaks positions that correspond to the SrNdCoRuO 6 phase: first row corresponds to the P 2_1 / n, second row to P 4_2 / n, third row to P 4 / m n c, fourth row to P 4_2 / n n m and fifth row to R \overline3 space group. The black rectangle section is shown bigger in Figure 5.2. Inset shows in detail the appearance of the primitive Bragg peak reflections with h+k+l= 2 n+1. * very small amount of unidentified impurity.'
