caption: Graphical representation of (a) and (c) ideal, and (b) and (d) distorted Sr / PrO_12 cubooctahedral configuration (highlighted in blue) for SrPrZnRuO_6 in the P 2_1 / n space group at room temperature. Projections along the cubic (simple) perovskite axes, (a) and (b) along [001]_p, and (c) and (d) along [010]_\text p . Yellowish sphere, light and dark blue spheres, and red sphere are A / A^\prime-site cation, B and B^\prime-site cation, and oxygen cation, respectively. B-O and B^\prime-O bonds are indicated in orange. In (a) white lines represent A / A^\prime-O bonds, and in (b) eight shortest A / A^\prime-O bonds are in white and four largest bonds in red. Grey circles highlight the B and B^\prime-site cations inside the second coordination-sphere.
