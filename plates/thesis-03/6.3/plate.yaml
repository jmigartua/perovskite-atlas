caption_plain: Graphical representation of (a) and (c) ideal, and (b) and (d) distorted Sr / PrO₁₂ cubooctahedral configuration (highlighted in blue) for SrPrZnRuO₆ in the P 2₁ / n space group at room temperature. Projections along the cubic (simple) perovskite axes, (a) and (b) along [001]_p, and (c) and (d) along [010]_p. Yellowish sphere, light and dark blue spheres, and red sphere are A / A^′-site cation, B and B^′-site cation, and oxygen cation, respectively. B-O and B^′-O bonds are indicated in orange. In (a) white lines represent A / A^′-O bonds, and in (b) eight shortest A / A^′-O bonds are in white and four largest bonds in red. Grey circles highlight the B and B^′-site cations inside the second coordination-sphere.
