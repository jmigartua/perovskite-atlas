caption: Results of the XRPD a) and b) and SXRPD c) and d) data refinements, in the 19-20^\circ and 5.15.3^\circ 2 \theta interval respectively, in SrNdCoRuO _6, using two different models with P 2_1 / n and P 4_2 / n space groups. The tetragonal space group has only one reflection in this 2 \theta interval, and is unable to take into account the splitting observed in SXRPD; on contrary, the monoclinic space group has three reflections and takes perfectly into account the splitting.
