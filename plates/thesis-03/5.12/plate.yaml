caption: 'Temperature evolution of the cell parameters and cell-volume of $\mathrm{SrNdMRuO}_{6} (M=\mathrm{Zn}, \mathrm{Co}, \mathrm{Mg}, \mathrm{Ni})$. The monoclinic $a$ and $b$ cell parameters have been scaled to be comparable with the tetragonal and cubic cell parameters. The transition temperatures ( $\mathrm{T}_{1}: P 2_{1} / n P 4_{2} / n; \mathrm{T}_{2}: P 4_{2} / n F m \overline{3} m$) for $\mathrm{SrNd} \mathrm{MRuO}_{6}(\mathrm{M}=\mathrm{Zn}, \mathrm{Co}, \mathrm{Mg}, \mathrm{Ni})$ are the following: $\mathrm{T}_{1}=740,660,560,440 \mathrm{K}$, and $\mathrm{T}_{2}=1060,1000,940$, 820 K, respectively.'
