caption_plain: Evolución con la temperatura de los grupos de picos de difracción de SrLaFeRuO₆ (a) y SrLaZnRuO₆ (b), que se encuentran alrededor de 57^° (2θ). Se puede observar la aparición de 'hombros'' al lado derecho de los picos a temperaturas 700 K y 800 K, respectivamente. Este efecto se puede considerar una evidencia de que los dos compuestos pasan por una transición de fase cerca de estas temperaturas.
