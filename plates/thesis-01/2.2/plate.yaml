caption: Posibles modificaciones de las estructuras de las perovskitas dobles, debidas a inclinaciones de los octaedros. Para cada modificación se muestran el símbolo del grupo espacial correspondiente y el tipo de inclinación [40]. Las líneas discontinuas conectan los grupos espaciales entre los cuales sólo es posible una transicion de fase de primer orden. Las líneas continuas representan algunas de las relaciones para las que transiciones de segundo orden están permitidas.
