caption: Datos de difracción de radiación sincrotrón $(\lambda=0.8005 \AA)$ recogidos en un rango corto de $2 \theta$ alrededor de $d=4.56 \AA$. Las líneas representan el ajuste de perfil obtenido con un modelo de dos picos. Las reflexiones están indexados con el grupo espacial $P 2_{1} / n$. La presencia de la reflexión (011) en el perfil de difracción confirma la distribución ordenada de los cationes B en $\mathrm{La}_{2} \mathrm{NiRuO}_{6}$
