caption_plain: Datos de difracción de radiación sincrotrón (λ=0.8005 Å) recogidos en un rango corto de 2 θ alrededor de d=4.56 Å. Las líneas representan el ajuste de perfil obtenido con un modelo de dos picos. Las reflexiones están indexados con el grupo espacial P 2₁ / n. La presencia de la reflexión (011) en el perfil de difracción confirma la distribución ordenada de los cationes B en La₂ NiRuO₆
