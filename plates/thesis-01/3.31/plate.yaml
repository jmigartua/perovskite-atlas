caption: Detalles de los perfiles de difracción de Sr_2 CuWO_6, mostrando la evolución con la temperatura de algunos picos de difracción. Los datos están recogidos con un paso en temperatura de 20 K . La escala de intensidad utilizada en las dos figuras es distinta para representar las distintas intensidades relativas. (a) Reflexión tetragonal (204) con intensidad relativa de 25 \%. Alrededor de 943 K se puede observar un comportamiento anómalo de la posición de esta reflexión. Esto se puede interpretar como evidencia de la presencia de una transicion de fase de una fase tetragonal a otra, también, tetragonal. (b) Reflexión cúbica (420) y el grupo de reflexiones tetragonales que provienen de ella después de la transición de primer orden a 1193 K . El comportamiento anómalo de las posiciones alrededor de 943 K se puede observar en todas la reflexiones representadas en la figura. A altas temperaturas se observa, también, la reflexión (116) de la impureza SrWO_4, que está muy cerca de la reflexión
  tetragonal (301) de Sr_2 CuWO_6. La intensidad relativa de la reflexión tetragonal (310) es de aproximadamente 2.2 \%. Los datos representados corresponden a la muestra Sr_2 CuWO_6(1) de la Tabla 3.1.
