caption: Variación con la temperatura de los parámetros de red de Sr₂ CuWO₆. Alrededor de 1193 K se puede observar una transición fuerte de primer orden que cambia la celda unidad de cúbica a tetragonal. Entre 1173 K y 1273 K las dos fases coexisten y no se han podido determinar los parámetros de red. Alrededor de 943 K se observa un pequeño efecto que se puede asociar a una segunda transición.
