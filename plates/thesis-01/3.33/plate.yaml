caption: Detalles de los perfiles de difracción de neutrones recogidos a diferentes temperaturas. Los datos en (a) son de la medida con capilar de V. Las temperaturas están en el rango de 320 K (curva más baja) a 940 K (curva más alta), con un paso de 80 K. Los datos en (b) y (c) son de la medida con capilar de Nb. El rango de temperaturas es de 320 K a 935 K, con un paso de 65 K. Los experimentos de difracción se han realizado con neutrones con longitud de onda $1.30 \AA$.
