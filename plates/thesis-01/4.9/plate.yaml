caption: Evolución con la temperatura del grupo de líneas de difracción con $2 \theta \approx 14.6^{\circ}$ de $\mathrm{SrLaNiRuO}_{6}$. La transición de fase discontinua de la fase monoclínica a la fase romboédrica se evidencia por el cambio en las posiciones y en las intensidades de las líneas de difracción. Las líneas discontinuas marcan el rango de temperaturas donde las dos fases coexisten.
