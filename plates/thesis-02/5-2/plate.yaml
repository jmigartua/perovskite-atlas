caption: presents the projection of the room-temperature crystal structures of $\mathrm{Sr}_{2} \mathrm{ScSbO}_{6}$ and $\mathrm{Ca}_{2} \mathrm{ScSbO}_{6}$ along the [010] double perovskite monoclinic lattice vector. The appreciable tilt of the octahedra is inferred from the deviation of $\mathrm{Sc}-\mathrm{O}-\mathrm{Sb}$ angles from the ideal value ( $180^{\circ}$), the deviation of the angle is bigger in the case of Ca compound ( $149^{\circ}$) in comparison to the Sr compound $\left(165^{\circ}\right)$, which means that the $\mathrm{Ca}_{2} \mathrm{ScSbO}_{6}$ is more distorted than $\mathrm{Sr}_{2} \mathrm{ScSbO}_{6}$.
