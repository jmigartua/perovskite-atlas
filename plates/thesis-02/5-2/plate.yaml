caption: presents the projection of the room-temperature crystal structures of Sr_2 ScSbO_6 and Ca_2 ScSbO_6 along the [010] double perovskite monoclinic lattice vector. The appreciable tilt of the octahedra is inferred from the deviation of Sc-O-Sb angles from the ideal value ( 180^\circ ), the deviation of the angle is bigger in the case of Ca compound ( 149^\circ ) in comparison to the Sr compound \left(165^\circ\right), which means that the Ca_2 ScSbO_6 is more distorted than Sr_2 ScSbO_6.
