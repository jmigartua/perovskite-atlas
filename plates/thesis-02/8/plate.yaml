caption: shows the evolution with temperature of the lattice parameters of $\mathrm{Sr}_{2} \mathrm{CoSbO}_{6}$. In this figure we have represented the unit cell in the rhombohedral description ( $a=b=c, \alpha=\beta=\gamma$), instead of the hexagonal one ( $a=b, \gamma=120^{\circ}$). This representation is more convenient for observing the disappearance of the trigonal distortion. As it can be observed in Fig. 8, the rhombohedral angle $\alpha$ decreases continuously with the temperature, and at $\approx 470 \mathrm{K}$ it becomes equal to 60 deg, the value at which the cubic symmetry is attained.
