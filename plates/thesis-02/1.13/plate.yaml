caption: 'Evolución de las amplitudes de los modos cuyas irrpes son $\Gamma_{1}^{+}$, $\Gamma_{3}^{+}$y $\Gamma_{4}^{+}$(modo primario) en la transición $I 4 / m \rightarrow F m \overline{3} m$, para tres tipos de refinamientos diferentes: puntos negros, refinamiento mediante coordenadas atómicas, con una restricción sobre una coordenada de uno de los oxígenos; estrellas en rojo, refinamiento mediante modos adaptados, también con una restricción, la amplitud del modo $\Gamma_{3}^{+}$ se fija en cero; estrellas en azul, refinamiento por modos, con una restricción, la amplitud del modo con $\Gamma_{3}^{+}$ fijada al valor que toma en la primera temperatura (ver texto).'
