caption: Experimental (symbols) and calculated (line) a) neutron and b) X-ray profiles for the Rietveld refinement of Na_0.5 ~K_0.5 NbO_3 at room-temperature using a structural model with Amm2 space group. Insets show in detail the presence of the 011 and 100 Bragg reflections corresponding to the orthorhombic symmetry. The (*)-symbol marked reflection corresponds to the signal of the Vanadium sample container used during the measurement. The bars in the lower part of the graphics represent the Bragg peak positions. In (a), the upper set of bars (in red) correspond to the first wavelength \lambda_1=2.52 \AA, and the lower set of bars (in blue) correspond to the second wavelength and \lambda_2=1.26 \AA.
