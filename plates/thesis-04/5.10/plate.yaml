caption: 'Thermal evolution of the lattice parameters of $\mathrm{Na}_{0.5} \mathrm{K}_{0.5} \mathrm{NbO}_{3}$, as obtained from XRPD and NPD measurements. Solid circles up 300 K, were obtained in the low-temperature NPD measurement and solid circles, from 300 to 875 K in the high-temperature XRPD measurement. The solid red points correspond to the long acquisition data at $2,10,175$ and 300 K temperatures. From 2 to 875 K the compound undergoes tree phase transitions with the following sequence: $R 3 c \rightarrow A m m 2 \rightarrow P 4 m m \rightarrow P m \overline{3} m$.'
