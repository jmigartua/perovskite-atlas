caption: 'Temperature evolution of the amplitudes of the modes breaking the symmetry from the cubic to the P 2_1 / n and R \overline3 symmetries, as obtained from the NPD ( 2-300 ~K )and XRPD (300-1600 K) data refinements. The GM_4^+, X_3^+, X_5^+\left(P 2_1 / n\right) and GM_4^+(R \overline3) are the irreps of the symmetry-modes whose presence sets the distortions in the mentioned distorted phases. In the case of the X_5^+irrep, in the lowtemperature range, we are showing separately the effectively freed two components of the 3 dimensional sub-space the irrep spans. In the case of the R \overline3 space group symmetry, we are also showing, dimmed, the two components of the GM_5^+irrep: they do not contribute effectively, so the final values of GM_4^+for this symmetry correspond to them having been freed alone. The lower part of the graph (blue symbols) shows the relative difference, in the whole temperature range, between the GM_4^+values in two refinements: only the effectively acting
  modes and all the modes freed. The continuos line in red is the fitting of the trigonal GM_4^+amplitude values to the equation: A_G M_4^+=A(0)_G M_4^+\left[T_C-T\right]^\alpha, with the refined values A(0)_G M_4^+= 0.127(8), T_c=1523(1) K and \alpha=0.26(1).'
