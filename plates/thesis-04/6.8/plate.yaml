  in red is the fitting of the trigonal GM₄⁺amplitude values to the equation: A_G M₄⁺=A(0)_G M₄⁺ [T_C-T ]^α, with the refined values A(0)_G M₄⁺= 0.127(8), T_c=1523(1) K and α=0.26(1).'
