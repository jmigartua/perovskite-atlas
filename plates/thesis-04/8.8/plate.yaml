caption: 'Temperature evolution of the lattice parameters of $\mathrm{Sr}_{2} \mathrm{MSbO}_{6}$. The cell parameters of the trigonal phase are shown in the hexagonal notation. The monoclinic and hexagonal parameters have been scaled to be comparable with the edge of the centered cubic. The $\mathrm{Sr}_{2} \mathrm{MSbO}_{6}$ materials undergo two phase transitions: a first-order one, discontinuous, transforming the cell from a monoclinic to a trigonal and a second one of the second-order from a triginal to a cubic cell. The phase-transition sequence is the following: $P 2_{1} / n \rightarrow R \overline{3} \rightarrow F m \overline{3} m$.'
