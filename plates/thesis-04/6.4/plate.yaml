caption: 'Experimental (symbols) and calculated (line) (a) X-ray profiles and (b) neutron profiles from the Rietveld refinements of La₂ CoMnO₆, using a structural model with P 2₁ / n space group, (a) and (b) at room temperature, from XRPD data and NPD, respectively. In (b), the (*)-symbol marked reflection corresponds to the signal of the Vanadium sample container used in the experiment. The bars in the lower part of the graphics represent the Bragg reflections'' positions. In (b), the upper set of bars correspond to the first wavelength λ₁=2.52 Å, and the lower set of bars correspond to the second wavelength λ₂=1.26 Å. Insets show in detail (a): ( 22^°-27^°) the presence of the superlattice reflections of the form h+k+l=2 n+1, corresponding to the P 2₁ / n symmetry, (85^°-89^°) the cubic refections ( 444) clearly splitted in the monoclinic symmetry into (044) (-404) (404), (b): selected region, (011) reflection, of the fitted results using an ordered and a disordered structural models.'
