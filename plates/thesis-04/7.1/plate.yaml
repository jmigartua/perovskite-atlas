caption: Energy projections, in the $\mathrm{X} 5+$ two-dimensional space (A10, A11), for a fixed value of $\mathrm{X}_{3}^{+}$as indicated and for the set of values of $\mathrm{GM}_{4}^{+}$, as indicated. The values for the amplitudes, are taken from a regular grid (16 points in each dimension) created to construct the energy, one virtual distorted structure for the given set of amplitude-values in the grid. The energy tetra-surface is constructed after the relaxed structures' energies, obtained form the simulations, are fitted to the polynomial constructed with the invariant, up to the fourth-order, terms describing the symmetry breaking form the prototype $F m \overline{3} m$ cubic to the $P 2_{1} / n$ monoclinic.
