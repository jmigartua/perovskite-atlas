caption: '(a) Relative atomic displacements with respect to the cubic structure, in the P4mm phase: those define polar distortion mode. (b) The four basis symmetry-modes present in a polar distortion along z of the perovskite structure. The 12 -dimensional subspace of all possible polar distortions is spanned by that set of basis modes and their analogous along $x$ and $y$. it is worth noting that the first three modes involve one atom per unit cell, the mode $\epsilon_{4}^{z}$ involves two atoms per cell and, hence, the normalization condition implies that the atomic displacements in thi tetra-mode basis are smaller by a $\frac{1}{\sqrt{2}}$ factor.'
