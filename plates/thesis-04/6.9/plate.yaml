caption: 'Variation with temperature of the lattice parameters for La_2 CoMnO_6, as obtained from the NPD (2-300 K)(dimmed black symbols) and XRPD (300-1600 K) data refinements. In the studied temperature range (2-1600 ~K), the compound undergoes two phase transitions: first-order one, discontinuous, at \simeq 450 K transforming the cell from a monoclinic to a trigonal; and a second one of the second-order occurring at \simeq 1520 ~K from a trigonal to a non-distorted cell, cubic. The phase-transition sequence is the following: P 2_1 / n \rightarrow R \overline3 \rightarrow F m \overline3 m.'
